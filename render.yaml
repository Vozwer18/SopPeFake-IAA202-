services:
  - type: web
    name: soppe-fake-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:demo
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: TRUST_PROXY
        value: '1'
      - key: MEDIA_STORAGE
        value: database
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
