<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sản phẩm · SopPe Fake</title>
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/product-list.css" />
  </head>
  <body>
    <div id="navbar"><header class="navbar">
  <div class="utility-bar"><div class="nav-shell"><span id="browse-mode">Khám phá SopPe Fake</span><div id="nav-account"><a href="login.html">Đăng nhập</a></div></div></div>
  <div class="navbar-top nav-shell"><a class="brand" href="index.html"><span>SopPe</span> <strong>Fake</strong></a><form class="search-box" id="global-search" role="search"><input id="search-input" type="search" aria-label="Tìm sản phẩm" placeholder="Bạn đang tìm sản phẩm gì?"><button>Tìm kiếm</button></form><a href="cart.html" class="cart-link" id="cart-link" hidden><span>Giỏ hàng</span><b id="cart-count">0</b></a></div>
  <nav class="category-menu nav-shell" aria-label="Danh mục"><a href="index.html">Trang chủ</a><a href="product-list.html">Tất cả sản phẩm</a><span id="nav-categories"></span></nav>
</header>
</div>
    <main class="container section">
      <div class="section-title">
        <div>
          <span class="eyebrow">KHÁM PHÁ SOPPE FAKE</span>
          <h1>Tất cả sản phẩm</h1>
          <p class="muted">Khám phá sản phẩm từ các cửa hàng trên SopPe Fake.</p>
        </div>
        <span class="badge" id="result-count" aria-live="polite"></span>
      </div>
      <div class="list-layout">
        <aside class="filter card">
          <form id="filter-form">
            <b>Tìm sản phẩm phù hợp</b><label for="local-search">Từ khóa</label
            ><input
              id="local-search"
              type="search"
              placeholder="Tên sản phẩm hoặc cửa hàng"
            /><label for="category-filter">Danh mục</label
            ><select id="category-filter">
              <option value="">Tất cả danh mục</option></select
            ><label for="sort">Sắp xếp</label
            ><select id="sort">
              <option value="default">Mới nhất</option>
              <option value="price-asc">Giá thấp → cao</option>
              <option value="price-desc">Giá cao → thấp</option>
              <option value="rating">Đánh giá cao nhất</option></select
            ><button class="btn btn-primary" type="submit">Áp dụng bộ lọc</button
            ><button class="btn btn-outline" type="button" id="reset-filters">Xóa bộ lọc</button>
            <p class="muted" id="category-note" role="status"></p>
          </form>
        </aside>
        <div id="product-list" class="product-grid" aria-live="polite">
          <div class="empty card">Đang tải sản phẩm…</div>
        </div>
      </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/product-list.js"></script>
  </body>
</html>
