<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tài khoản của tôi · SopPe Fake</title>
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="container section">
      <div class="section-title">
        <div>
          <span class="eyebrow">USER PANEL</span>
          <h1 id="user-heading">Tài khoản của tôi</h1>
          <p class="muted">Không gian mua sắm dành riêng cho bạn.</p>
        </div>
        <a class="btn btn-primary" href="product-list.html">Khám phá sản phẩm →</a>
      </div>
      <p id="user-message" role="status" aria-live="polite"></p>
      <div class="stat-grid account-stats">
        <div class="card stat">
          <small>Sản phẩm trong giỏ</small><strong id="user-cart-count">—</strong>
        </div>
        <div class="card stat">
          <small>Tạm tính giỏ hàng</small><strong id="user-cart-total">—</strong>
        </div>
      </div>
      <section class="card account-card">
        <div class="section-title">
          <h2>Thông tin tài khoản</h2>
          <span class="badge">Người mua</span>
        </div>
        <dl id="user-profile" class="account-profile">
          <div class="empty">Đang tải thông tin…</div>
        </dl>
      </section>
      <section class="card account-card">
        <h2>Tiếp tục mua sắm</h2>
        <p class="muted">Xem sản phẩm, chọn phân loại và quản lý giỏ hàng của bạn.</p>
        <div class="actions">
          <a class="btn btn-primary" href="product-list.html">Xem tất cả sản phẩm</a
          ><a class="btn btn-outline" href="cart.html">Mở giỏ hàng</a>
        </div>
      </section>
    </main>
    <script src="js/common.js"></script>
    <script src="js/user-panel.js"></script>
  </body>
</html>
